[project]
name = "flight-delay-mlops"
version = "0.1.0"
description = "MLOps pipeline for flight delay prediction and cause classification (RU 2023-2025)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "George" }]

dependencies = [
    # Data handling
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "pyarrow>=17.0",
    "polars>=1.0",

    # ML core
    "scikit-learn>=1.5,<2.0",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2",
    "imbalanced-learn>=0.13",
    "optuna>=4.0",
    "shap>=0.46",

    # MLOps
    "mlflow>=3.0,<4.0",
    "dvc>=3.55",

    # API / serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",

    # Monitoring
    "evidently>=0.4",
    "prometheus-client>=0.21",

    # Configuration
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "data", "mlruns", ".dvc"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "N803",  # argument should be lowercase (X, y are conventional in ML)
    "N806",  # variable in function should be lowercase (X, y)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
exclude = ["notebooks", "build", "dist"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: integration tests requiring data files",
]
