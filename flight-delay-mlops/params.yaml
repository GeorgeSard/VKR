# Central parameter file for the DVC pipeline.
# Every reproducible run reads from here. Edit -> `dvc repro` reruns affected stages.

seed: 42

data:
  raw_path: data/raw/flight_delays_ru.parquet
  interim_dir: data/interim
  processed_dir: data/processed

split:
  # Time-based split is mandatory (CLAUDE.md rule 2). NEVER random.
  train_years: [2023]
  val_years: [2024]
  test_years: [2025]

features:
  # One of: BASELINE, EXTENDED, WITH_NETWORK
  feature_set: EXTENDED

train_binary:
  # Stage 1: is_departure_delayed_15m (drops cancellations).
  model: logreg              # Stage 3 smoke baseline: logreg | random_forest
  target: is_departure_delayed_15m
  class_weight: balanced     # null | balanced
  hyperparams:
    C: 1.0
    max_iter: 200
    solver: liblinear

train_cause:
  # Stage 2: probable_delay_cause on delayed flights only.
  model: logreg
  target: probable_delay_cause
  classes: [weather, airport_congestion, reactionary, carrier_operational, security]
  class_weight: balanced
  hyperparams:
    C: 1.0
    max_iter: 200
    solver: liblinear

tuning:
  enabled: false
  n_trials: 50
  timeout_seconds: 1800

mlflow:
  enabled: true
  # Local default keeps `dvc repro` self-contained.
  # To log into Docker MLflow server:
  # MLFLOW_TRACKING_URI=http://localhost:5000 dvc repro -f train_binary -f train_cause
  tracking_uri: sqlite:///mlflow.db
  experiment_binary: flight-delay-binary
  experiment_cause: flight-delay-cause
  experiment_experiments: flight-delay-experiments
